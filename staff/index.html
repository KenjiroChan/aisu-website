<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AISU · Staff</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 20.5s-7.5-4.6-9.3-9.4C1.4 7.6 3.6 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3.1 1.6-1.9 3.1-3.1 5.2-3.1 3.2 0 5.4 3.1 4.1 6.6-1.8 4.8-9.3 9.4-9.3 9.4z' fill='%23C9195C'/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Unbounded';font-weight:800;font-display:swap;src:url(../fonts/unbounded-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-weight:600;font-display:swap;src:url(../fonts/cormorant-garamond-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:400;font-display:swap;src:url(../fonts/outfit-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:500;font-display:swap;src:url(../fonts/outfit-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:600;font-display:swap;src:url(../fonts/outfit-latin-600-normal.woff2) format('woff2')}
/* Layout: a working tool, not a brochure. Wine top bar with the AISU mark, tabs, then a dense board of cards.
   Status is carried by a coloured stripe and a chip, so a glance across the counter shows what needs doing. */
:root{
  --bg:#F7F1F0; --surface:#FFFFFF; --surface-2:#FCE3E7; --line:rgba(160,20,70,.16);
  --ink:#3A0E22; --muted:#8A5A6E; --wine:#C9195C; --wine-dk:#A3124A; --paper:#FFF9F9; --gold:#F2B33D;
  --new:#C9195C; --prep:#D98A0B; --ready:#2E7D4F; --done:#8A8A8A; --err:#B3261E;
  --f-mark:"Unbounded","Arial Black",sans-serif; --f-display:"Cormorant Garamond",Georgia,serif; --f-body:"Outfit","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums lining-nums}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mark{font-family:var(--f-mark);font-weight:800;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;min-height:42px}
.btn-fill{background:var(--wine);color:#fff}
.btn-fill:hover{background:var(--wine-dk)}
.btn-ghost{background:transparent;color:var(--wine);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--wine)}
.btn-danger{background:transparent;color:var(--err);box-shadow:inset 0 0 0 1.5px rgba(179,38,30,.3)}
.btn-danger.armed{background:var(--err);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:6px}
label{font-weight:600;font-size:14px}
input[type=email],input[type=password],input[type=search],input[type=number],input[type=date]{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff}
input:focus{outline:none;border-color:var(--wine);box-shadow:0 0 0 3px rgba(242,179,61,.4)}
.msg{padding:10px 14px;border-radius:12px;font-size:14px}
.msg.err{background:rgba(179,38,30,.08);color:var(--err)}
.msg.ok{background:rgba(46,125,79,.1);color:var(--ready)}

/* sign-in */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right))}
.login-card{width:min(420px,100%);background:var(--surface);border-radius:24px;padding:32px 28px;display:grid;gap:18px;box-shadow:0 0 0 1px var(--line),0 24px 48px -32px rgba(120,10,50,.45)}
.login-card .mark{font-size:34px;color:var(--wine);line-height:1}
.login-card h1{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0}
.linkbtn{border:0;background:none;color:var(--wine);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;justify-self:start;font-size:14px}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--wine);color:#fff;padding:env(safe-area-inset-top) 0 0}
.top-row{display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));flex-wrap:wrap}
.top-row .mark{font-size:20px}
.top-row .sub{opacity:.85;font-size:13px}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chipbtn{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;min-height:34px}
.chipbtn[aria-pressed="true"]{background:#fff;color:var(--wine)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 max(10px,env(safe-area-inset-left));background:var(--wine-dk)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:none;color:rgba(255,255,255,.8);padding:12px 16px;font-weight:600;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--gold)}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.badge[data-n="0"]{display:none}
.offline{background:#3A0E22;color:#fff;font-size:13px;padding:8px 16px;text-align:center}
main{padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));max-width:1400px;margin:0 auto}
h2{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0}
.view-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head .sub{color:var(--muted);font-size:14px}

/* order board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.col{display:grid;gap:12px;align-content:start;min-width:0}
.col-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 2px}
.col-head i{width:10px;height:10px;border-radius:50%}
.empty{color:var(--muted);font-size:14px;padding:18px;border:1.5px dashed var(--line);border-radius:16px;text-align:center}
.card{position:relative;background:var(--surface);border-radius:16px;padding:16px 16px 14px 20px;box-shadow:0 0 0 1px var(--line);display:grid;gap:10px;min-width:0;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--stripe,var(--line))}
.card.is-new{--stripe:var(--new)} .card.is-preparing{--stripe:var(--prep)} .card.is-ready{--stripe:var(--ready)}
.card.is-confirmed{--stripe:var(--wine)} .card.is-seated{--stripe:var(--ready)} .card.is-noshow,.card.is-cancelled,.card.is-collected{--stripe:var(--done);opacity:.75}
.card.flash{animation:flash 1.2s ease-out 3}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 1px var(--line)}}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none;box-shadow:0 0 0 3px var(--gold)}}
.card-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.when{font-size:22px;font-weight:700;color:var(--ink)}
.when small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.ref{font-family:var(--f-mark);font-size:12px;letter-spacing:.04em;color:var(--wine);margin-left:auto}
.who{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.who b{font-size:16px}
.who a{color:var(--muted);text-decoration:none}
.who a:hover{color:var(--wine);text-decoration:underline}
.items{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.items li{display:flex;gap:10px;justify-content:space-between}
.items li span:first-child{min-width:0}
.items .q{font-weight:700;color:var(--wine);margin-right:4px}
.items .pr{color:var(--muted);white-space:nowrap}
.total{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;font-weight:700}
.note{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:14px}
.meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--wine)}
.chip.st-ready,.chip.st-seated,.chip.st-collected{background:rgba(46,125,79,.12);color:var(--ready)}
.chip.st-preparing{background:rgba(217,138,11,.14);color:#8a5600}
.chip.st-cancelled,.chip.st-noshow{background:#eee;color:#666}
details.past{margin-top:20px}
details.past summary{cursor:pointer;font-weight:600;color:var(--muted);padding:8px 0}
.past-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:8px}

/* tables */
.daynav{display:flex;align-items:center;gap:8px}
.daynav input{width:auto}
.slotbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:6px;margin-bottom:16px}
.slotbar span{flex:0 0 auto;border-radius:12px;padding:6px 10px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:13px;display:grid;gap:2px;min-width:74px}
.slotbar span b{font-size:14px}
.slotbar span.full{background:var(--surface-2);box-shadow:0 0 0 1.5px var(--wine)}
.res-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

/* search, settings, team */
.searchbar{display:flex;gap:10px;max-width:640px;margin-bottom:8px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.panel{background:var(--surface);border-radius:18px;padding:22px;box-shadow:0 0 0 1px var(--line);display:grid;gap:12px;max-width:640px;margin-bottom:16px}
.panel h3{margin:0;font-size:17px}
.panel p{margin:0;color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row input[type=number]{width:120px}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:52px;height:30px;border-radius:999px;background:#d9c9cf;position:relative;transition:background .2s;flex-shrink:0}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .track{background:var(--err)}
.switch input:checked + .track::after{transform:translateX(22px)}
.switch input:focus-visible + .track{outline:2px solid var(--gold);outline-offset:2px}
.team-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.team-list li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--bg);overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,160%);visibility:hidden;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:500;transition:transform .25s,visibility 0s linear .25s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .25s}
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <span class="mark">AISU</span>
    <h1 data-t="signin.title">Connexion du personnel</h1>
    <div class="field"><label for="lEmail" data-t="email">E-mail</label><input type="email" id="lEmail" autocomplete="username" required></div>
    <div class="field"><label for="lPass" data-t="password">Mot de passe</label><input type="password" id="lPass" autocomplete="current-password" required></div>
    <p class="msg err" id="lErr" role="alert" hidden></p>
    <p class="msg ok" id="lOk" role="status" hidden></p>
    <button class="btn btn-fill" type="submit" id="lBtn" data-t="signin">Se connecter</button>
    <button class="linkbtn" type="button" id="lForgot" data-t="forgot">Mot de passe oublié ?</button>
    <div class="row" style="justify-content:flex-end"><button class="linkbtn" type="button" data-lang-toggle>English</button></div>
  </form>
</section>

<section class="login" id="denied" hidden>
  <div class="login-card">
    <span class="mark">AISU</span>
    <h1 data-t="denied.title">Ce compte n'a pas accès</h1>
    <p id="deniedBody"></p>
    <button class="btn btn-ghost" type="button" data-signout data-t="signout">Se déconnecter</button>
  </div>
</section>

<div id="shell" hidden>
  <header class="top">
    <div class="top-row">
      <span class="mark">AISU</span><span class="sub" data-t="title">Espace personnel</span>
      <span class="sub" id="today"></span>
      <div class="top-tools">
        <button class="chipbtn" type="button" id="soundBtn" aria-pressed="false" data-t="sound.off">Activer le son</button>
        <button class="chipbtn" type="button" data-lang-toggle>English</button>
        <button class="chipbtn" type="button" data-signout data-t="signout">Se déconnecter</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-view="orders" aria-selected="true"><span data-t="tab.orders">Commandes</span><span class="badge" id="newCount" data-n="0">0</span></button>
      <button type="button" role="tab" data-view="tables" aria-selected="false"><span data-t="tab.tables">Tables</span></button>
      <button type="button" role="tab" data-view="search" aria-selected="false"><span data-t="tab.search">Recherche</span></button>
      <button type="button" role="tab" data-view="settings" aria-selected="false"><span data-t="tab.settings">Réglages</span></button>
      <button type="button" role="tab" data-view="team" aria-selected="false" id="teamTab" hidden><span data-t="tab.team">Équipe</span></button>
    </nav>
    <div class="offline" id="offline" hidden data-t="offline">Hors ligne</div>
  </header>

  <main>
    <section data-panel="orders">
      <div class="board">
        <div class="col"><div class="col-head"><i style="background:var(--new)"></i><span data-t="col.new">Nouvelles</span></div><div class="col" id="colNew"></div></div>
        <div class="col"><div class="col-head"><i style="background:var(--prep)"></i><span data-t="col.preparing">En préparation</span></div><div class="col" id="colPrep"></div></div>
        <div class="col"><div class="col-head"><i style="background:var(--ready)"></i><span data-t="col.ready">Prêtes</span></div><div class="col" id="colReady"></div></div>
      </div>
      <details class="past"><summary><span data-t="col.done">Récupérées et annulées</span> (<span id="pastCount">0</span>)</summary><div class="past-list" id="colPast"></div></details>
    </section>

    <section data-panel="tables" hidden>
      <div class="view-head">
        <h2 id="tablesTitle"></h2>
        <div class="daynav">
          <button class="btn btn-ghost" type="button" id="dayPrev" aria-label="−1">‹</button>
          <input type="date" id="dayPick">
          <button class="btn btn-ghost" type="button" id="dayNext" aria-label="+1">›</button>
          <button class="btn btn-ghost" type="button" id="dayToday" data-t="today">Aujourd'hui</button>
        </div>
        <span class="sub" id="tablesSummary"></span>
      </div>
      <div class="slotbar" id="slotBar" aria-label="slots"></div>
      <div class="res-list" id="resList"></div>
    </section>

    <section data-panel="search" hidden>
      <div class="view-head"><h2 data-t="tab.search">Recherche</h2></div>
      <form class="searchbar" id="searchForm" role="search"><input type="search" id="searchIn" autocomplete="off"><button class="btn btn-fill" type="submit" data-t="tab.search">Recherche</button></form>
      <p class="sub" style="color:var(--muted);font-size:14px;margin:0" data-t="search.hint"></p>
      <div class="results" id="results"></div>
    </section>

    <section data-panel="settings" hidden>
      <div class="view-head"><h2 data-t="tab.settings">Réglages</h2></div>
      <div class="panel">
        <h3 data-t="pause.label">Commandes en ligne</h3>
        <label class="switch"><input type="checkbox" id="pauseIn"><span class="track"></span><span id="pauseState"></span></label>
        <p data-t="pause.hint"></p>
      </div>
      <div class="panel">
        <h3><label for="capIn" data-t="cap.label">Personnes maximum par demi-heure</label></h3>
        <div class="row"><input type="number" id="capIn" min="1" max="200" step="1"><button class="btn btn-fill" type="button" id="capSave" data-t="save">Enregistrer</button><span id="capMsg" class="sub" style="color:var(--ready);font-weight:600"></span></div>
        <p data-t="cap.hint"></p>
      </div>
      <div class="panel" id="cleanupPanel" hidden>
        <h3 data-t="cleanup.title">Nettoyer les anciennes données</h3>
        <p data-t="cleanup.body"></p>
        <div class="row"><button class="btn btn-danger" type="button" id="cleanupBtn" data-t="cleanup.btn">Supprimer</button><span id="cleanupMsg" class="sub"></span></div>
      </div>
      <p class="msg err" id="settingsErr" role="alert" hidden></p>
    </section>

    <section data-panel="team" hidden>
      <div class="view-head"><h2 data-t="tab.team">Équipe</h2></div>
      <div class="panel">
        <p data-t="team.body"></p>
        <form class="row" id="teamForm"><input type="email" id="teamIn" autocomplete="off" style="flex:1;min-width:200px" aria-label="E-mail"><button class="btn btn-fill" type="submit" data-t="add">Ajouter</button></form>
        <p class="msg err" id="teamErr" role="alert" hidden></p>
        <ul class="team-list" id="teamList"></ul>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/menu-data.js"></script>
<script src="../assets/firebase-config.js"></script>
<script type="module" src="staff.js"></script>
</body>
</html>
